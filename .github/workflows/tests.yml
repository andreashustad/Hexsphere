name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test suite
        run: node tests/run.js
      - name: Check the app icons are up to date
        run: |
          node tools/make-icons.js
          git diff --exit-code -- icons android/app/src/main/res
